
collision_monitor:
  ros__parameters:
    use_sim_time: True

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

    cmd_vel_in_topic: "/cmd_vel_pre_monitor"
    cmd_vel_out_topic: "/cmd_vel"

    transform_tolerance: 0.5
    source_timeout: 1.0
    stop_pub_timeout: 2.0

    polygons: ["PolygonStop", "PolygonSlow"]

    PolygonStop:
      type: "polygon"
      points: [0.55, 0.35, 0.55, -0.35, 0.0, -0.35, 0.0, 0.35]
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"

    PolygonSlow:
      type: "polygon"
      points: [0.90, 0.45, 0.90, -0.45, 0.0, -0.45, 0.0, 0.45]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"

    observation_sources: ["scan"]

    scan:
      type: "scan"
      topic: "/scan"
